# parent class JSBSimEnv config
fdm_freq: 100.0 # 120 Hz being the default JSBSim freq
agent_freq: 100.0
episode_length_s: 20.0
viz_time_factor: 50.0
debug: True
render_mode: "none"
plot_at_episode_end: True # with plot or FlightGear rendering, open a static telemetry plot after each episode
sim_profile: current # simulator behavior: current, or icinco2024 for the ICINCO 2024 paper-era profile

# JSBSim simulation env options - train
train_sim_options:
    seed: ??? # JSBSim level seed
    atmosphere:
        severity: "off"
        variable: False
        wind:
            enable: False
            rand_continuous: False
        turb:
            enable: False
        gust:
            enable: False
    rand_fdm:
        enable: False
    was_evaluating: False
    eval: False

# JSBSim simulation env options - eval
eval_sim_options:
    seed: ??? # JSBSim level seed
    atmosphere:
        severity: ["off"]
        variable: False
        wind:
            enable: False
            rand_continuous: False
        turb:
            enable: False
        gust:
            enable: False
    rand_fdm:
        enable: False
    was_evaluating: True
    eval: True

