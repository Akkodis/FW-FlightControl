# @package env.jsbsim
# Constant wind only.
train_sim_options:
    seed: ??? # JSBSim level seed
    atmosphere:
        severity: null
        variable: True
        wind:
            enable: True
            wind_severity: 5.0
            rand_windspeed: False
        turb:
            enable: False
        gust:
            enable: False
    rand_fdm:
        enable: False
    was_evaluating: False
    eval: False

eval_sim_options:
    seed: ??? # JSBSim level seed
    atmosphere:
        severity: ["light"] # overridden per run by evaluation.atmo_severities
        variable: False
        wind:
            enable: True
            wind_dir: ??? # North, East, Down, if unspecified, wind_dir is random
            rand_windspeed: False # if True, wind_severity is ignored
            wind_severity: ??? # off, light, moderate, severe, float (for custom wind speed)
        turb:
            enable: False
        gust:
            enable: False
    rand_fdm:
        enable: False
    was_evaluating: True
    eval: True
