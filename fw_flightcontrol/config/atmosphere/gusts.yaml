# @package env.jsbsim
# Gusts only, without wind or turbulence.
train_sim_options:
    seed: ??? # JSBSim level seed
    atmosphere:
        severity: null
        variable: True
        wind:
            enable: False
            rand_continuous: False
        turb:
            enable: False
        gust:
            enable: True
    rand_fdm:
        enable: False
    was_evaluating: False
    eval: False

eval_sim_options:
    seed: ??? # JSBSim level seed
    atmosphere:
        severity: moderate # overridden per run by evaluation.atmo_severities
        variable: False
        wind:
            enable: False
            rand_continuous: False
        turb:
            enable: False
        gust:
            enable: True
    rand_fdm:
        enable: False
    was_evaluating: True
    eval: True
